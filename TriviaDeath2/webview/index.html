<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Murder Party 2</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --panel-alt: #1c202a;
            --border: #2a2e3a;
            --text: #e7e9ee;
            --text-dim: #9aa0ac;
            --accent: #e63950;
            --accent-dim: #7a1f2c;
            --focus: #ff5c72;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app {
            display: grid;
            grid-template-columns: 340px 1fr;
            min-height: 100vh;
        }

        .panel {
            padding: 28px 24px;
        }

        .panel-left {
            background: var(--panel);
            border-right: 1px solid var(--border);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .panel-left h1 {
            font-size: 22px;
            margin: 0 0 4px 0;
            letter-spacing: 0.3px;
        }

        .subtitle {
            color: var(--text-dim);
            margin: 0 0 28px 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .search-group {
            margin-bottom: 24px;
        }

        .search-group label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .search-group input {
            width: 100%;
            padding: 10px 12px;
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .search-group input:focus {
            outline: none;
            border-color: var(--focus);
        }

        .search-group button {
            width: 100%;
            padding: 10px 12px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .search-group button:hover {
            background: var(--focus);
        }

        .panel-right {
            overflow-y: auto;
            height: 100vh;
        }

        .panel-right h2 {
            margin: 0 0 20px 0;
            font-size: 18px;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #results-container p {
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            padding: 14px 16px;
            margin: 0 0 12px 0;
            line-height: 1.5;
        }

        #results-container:empty::before {
            content: "No results yet — search a question on the left.";
            color: var(--text-dim);
            font-style: italic;
        }

        .search-group {
            position: relative;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: calc(100% - 4px);
            left: 0;
            right: 0;
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-radius: 6px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 20;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        .dropdown.open {
            display: block;
        }

        .dropdown-item {
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.4;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover,
        .dropdown-item.active {
            background: var(--accent-dim);
        }

        .dropdown-item mark {
            background: transparent;
            color: var(--focus);
            font-weight: 700;
        }

        .dropdown-empty {
            padding: 10px 12px;
            font-size: 13px;
            color: var(--text-dim);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="panel panel-left">
            <h1>Trivia Murder Party 2</h1>
            <p class="subtitle">Cheatsheet</p>

            <div class="search-group">
                <label for="questionSearch">Search Question</label>
                <input id="questionSearch" type="text" placeholder="type here" autocomplete="off">
                <button id="search-btn" value="search" onclick="searchQuestion()">Search</button>
                <div id="questionDropdown" class="dropdown"></div>
            </div>

            <div class="search-group">
                <label for="finalQuestionSearch">Search Final Question</label>
                <input id="finalQuestionSearch" type="text" placeholder="final question" autocomplete="off">
                <button id="search-btn2" value="search" onclick="searchFinalQuestion()">Search</button>
                <div id="finalQuestionDropdown" class="dropdown"></div>
            </div>
        </aside>

        <main class="panel panel-right">
            <h2>Results</h2>
            <div id="results-container"></div>
        </main>
    </div>

    <script src="TDQuestion.js"></script>
    <script src="TDFinalRound.js"></script>
    <script>
        var activeDropdownIndex = -1
        var currentDropdownItems = []

        function stripTags(html){
            return html.replace(/<[^>]+>/g, '')
        }

        function fuzzyScore(text, query){
            var lowerText = text.toLowerCase()
            var lowerQuery = query.toLowerCase()
            if (!lowerQuery) return -1

            var plain = stripTags(lowerText)
            var idx = plain.indexOf(lowerQuery)
            if (idx !== -1) {
                var score = 1000 - idx
                if (idx === 0) score += 200
                return score
            }

            var qi = 0
            var score2 = 0
            var lastMatch = -1
            var streak = 0
            for (var ti = 0; ti < plain.length && qi < lowerQuery.length; ti++) {
                if (plain[ti] === lowerQuery[qi]) {
                    streak = (lastMatch === ti - 1) ? streak + 1 : 1
                    score2 += streak
                    lastMatch = ti
                    qi++
                }
            }

            if (qi < lowerQuery.length) return -1
            return score2
        }

        function highlightMatch(text, query){
            var plain = stripTags(text)
            if (!query) return plain

            var idx = plain.toLowerCase().indexOf(query.toLowerCase())
            if (idx === -1) return plain

            return plain.slice(0, idx) + '<mark>' + plain.slice(idx, idx + query.length) + '</mark>' + plain.slice(idx + query.length)
        }

        function smartMatches(list, query, limit){
            var scored = []
            for (var i = 0; i < list.length; i++) {
                var s = fuzzyScore(list[i].text, query)
                if (s >= 0) scored.push({ item: list[i], score: s })
            }
            scored.sort(function(a, b){ return b.score - a.score })
            return scored.slice(0, limit || 8)
        }

        function getCorrectAnswerText(item){
            var correct = item.choices.filter(function(c){ return c.correct })
            var texts = correct.map(function(c){ return c.text })
            texts.sort(function(a, b){ return a.localeCompare(b) })
            return texts.join('<br>')
        }

        function renderResult(item){
            document.getElementById("results-container").innerHTML =
                '<p>' + item.text + '<br>Answer:<br><strong>' + getCorrectAnswerText(item) + '</strong></p>'
        }

        function renderMatchList(list, query){
            var matches = smartMatches(list, query, 50)
            document.getElementById("results-container").innerHTML = matches.map(function(m){
                return '<p>' + m.item.text + '<br>Answer:<br><strong>' + getCorrectAnswerText(m.item) + '</strong></p>'
            }).join('')
        }

        function renderDropdown(dropdownEl, matches, query){
            currentDropdownItems = matches
            activeDropdownIndex = -1

            if (!query || matches.length === 0) {
                dropdownEl.innerHTML = query ? '<div class="dropdown-empty">No matches</div>' : ''
                dropdownEl.classList.toggle('open', !!query)
                return
            }

            dropdownEl.innerHTML = matches.map(function(m, i){
                return '<div class="dropdown-item" data-index="' + i + '">' + highlightMatch(m.item.text, query) + '</div>'
            }).join('')

            dropdownEl.classList.add('open')
        }

        function closeDropdown(dropdownEl){
            dropdownEl.classList.remove('open')
            dropdownEl.innerHTML = ''
            currentDropdownItems = []
            activeDropdownIndex = -1
        }

        function setActiveDropdownItem(dropdownEl, newIndex){
            var items = dropdownEl.querySelectorAll('.dropdown-item')
            items.forEach(function(el){ el.classList.remove('active') })
            if (newIndex >= 0 && newIndex < items.length) {
                items[newIndex].classList.add('active')
                items[newIndex].scrollIntoView({ block: 'nearest' })
            }
            activeDropdownIndex = newIndex
        }

        function wireSearch(inputId, dropdownId, list){
            var input = document.getElementById(inputId)
            var dropdown = document.getElementById(dropdownId)
            var debounceTimer

            input.addEventListener('input', function(){
                clearTimeout(debounceTimer)
                debounceTimer = setTimeout(function(){
                    var query = input.value.trim()
                    var matches = smartMatches(list, query, 8)
                    renderDropdown(dropdown, matches, query)
                }, 120)
            })

            input.addEventListener('keydown', function(e){
                var items = dropdown.querySelectorAll('.dropdown-item')

                if (e.key === 'ArrowDown') {
                    e.preventDefault()
                    if (items.length) setActiveDropdownItem(dropdown, Math.min(activeDropdownIndex + 1, items.length - 1))
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault()
                    if (items.length) setActiveDropdownItem(dropdown, Math.max(activeDropdownIndex - 1, 0))
                } else if (e.key === 'Enter') {
                    e.preventDefault()
                    var pick = activeDropdownIndex >= 0 ? currentDropdownItems[activeDropdownIndex] : currentDropdownItems[0]
                    if (pick) {
                        renderResult(pick.item)
                        input.value = stripTags(pick.item.text)
                        closeDropdown(dropdown)
                    } else {
                        renderMatchList(list, input.value.trim())
                    }
                } else if (e.key === 'Escape') {
                    closeDropdown(dropdown)
                }
            })

            dropdown.addEventListener('click', function(e){
                var el = e.target.closest('.dropdown-item')
                if (!el) return
                var pick = currentDropdownItems[parseInt(el.dataset.index, 10)]
                if (pick) {
                    renderResult(pick.item)
                    input.value = stripTags(pick.item.text)
                    closeDropdown(dropdown)
                }
            })

            document.addEventListener('click', function(e){
                if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                    closeDropdown(dropdown)
                }
            })
        }

        function searchQuestion(){
            var query = document.getElementById("questionSearch").value.trim()
            renderMatchList(TDQuestion.content, query)
            closeDropdown(document.getElementById("questionDropdown"))
        }

        function searchFinalQuestion(){
            var query = document.getElementById("finalQuestionSearch").value.trim()
            renderMatchList(TDFinalRound.content, query)
            closeDropdown(document.getElementById("finalQuestionDropdown"))
        }

        wireSearch('questionSearch', 'questionDropdown', TDQuestion.content)
        wireSearch('finalQuestionSearch', 'finalQuestionDropdown', TDFinalRound.content)
</script>
</body>
</html>
